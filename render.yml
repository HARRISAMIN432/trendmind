services:
  - type: web
    name: digestai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      # --- App ---
      - key: APP_NAME
        value: DigestAI
      - key: ENVIRONMENT
        value: production

      # --- Database (Neon Postgres) ---
      - key: DATABASE_URL
        sync: false

      # --- LLM providers - Groq (5 keys) ---
      - key: GROQ_API_KEY1
        sync: false
      - key: GROQ_API_KEY2
        sync: false
      - key: GROQ_API_KEY3
        sync: false
      - key: GROQ_API_KEY4
        sync: false
      - key: GROQ_API_KEY5
        sync: false

      # --- LLM providers - Gemini (5 keys) ---
      - key: GOOGLE_API_KEY1
        sync: false
      - key: GOOGLE_API_KEY2
        sync: false
      - key: GOOGLE_API_KEY3
        sync: false
      - key: GOOGLE_API_KEY4
        sync: false
      - key: GOOGLE_API_KEY5
        sync: false

      # --- Chroma Vector DB ---
      - key: CHROMA_HOST
        sync: false
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        value: trendmind
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_data

      # --- Model Configuration ---
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_MODEL
        value: gemini-3.0-flash

      # --- LangSmith (optional) ---
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: trendmind

      # --- Scheduler ---
      # Recommended for Render free tier: keep False, drive production via
      # .github/workflows/ingest.yml instead (dyno spin-down makes in-process
      # timers unreliable). See status.md M21 notes.
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: PIPELINE_INTERVAL_HOURS
        value: "6"
      - key: TRENDS_INTERVAL_HOURS
        value: "12"
      - key: GRAPH_INTERVAL_HOURS
        value: "12"
      - key: NEWSLETTER_HOUR_UTC
        value: "6"
      - key: SCHEDULER_API_KEY
        sync: false

      # --- CORS Hardening ---
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app

      # --- Rate Limiting ---
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"

    autoDeploy: true

name: DigestAI Scheduled Jobs

on:
  schedule:
    # Ingestion pipeline — every 6 hours
    - cron: "0 */6 * * *"
    # Trend generation + knowledge graph build — twice daily
    - cron: "30 5,17 * * *"
    # Newsletter — once daily
    - cron: "0 6 * * *"
  workflow_dispatch: {} # lets you trigger any job manually from the Actions tab

jobs:
  run-pipeline:
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion pipeline
        run: |
          RESPONSE=$(curl -sS -f \
            -X POST "${{ secrets.API_BASE_URL }}/internal/run-pipeline" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 1800 \
            -w "\nHTTP_STATUS:%{http_code}" \
            --retry 2 \
            --retry-delay 30 \
            --retry-connrefused \
            2>&1) || EXIT_CODE=$?

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)

          if [ -z "$HTTP_STATUS" ] || [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Pipeline failed (HTTP ${HTTP_STATUS:-no response})"
            exit 1
          fi

          echo "Pipeline completed successfully (HTTP $HTTP_STATUS)"

  run-trends-and-graph:
    runs-on: ubuntu-latest
    needs: run-pipeline
    if: |
      always() &&
      (github.event.schedule == '30 5,17 * * *' || github.event_name == 'workflow_dispatch') &&
      (needs.run-pipeline.result == 'success' || needs.run-pipeline.result == 'skipped')
    steps:
      - name: Trigger trend generation
        run: |
          RESPONSE=$(curl -sS -f \
            -X POST "${{ secrets.API_BASE_URL }}/internal/run-trends" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 1800 \
            -w "\nHTTP_STATUS:%{http_code}" \
            --retry 2 \
            --retry-delay 30 \
            --retry-connrefused \
            2>&1) || EXIT_CODE=$?

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)

          if [ -z "$HTTP_STATUS" ] || [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Trend generation failed (HTTP ${HTTP_STATUS:-no response})"
            exit 1
          fi

          echo "Trends generated successfully (HTTP $HTTP_STATUS)"

      - name: Trigger knowledge graph build
        run: |
          RESPONSE=$(curl -sS -f \
            -X POST "${{ secrets.API_BASE_URL }}/internal/run-graph" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 1800 \
            -w "\nHTTP_STATUS:%{http_code}" \
            --retry 2 \
            --retry-delay 30 \
            --retry-connrefused \
            2>&1) || EXIT_CODE=$?

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)

          if [ -z "$HTTP_STATUS" ] || [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Knowledge graph build failed (HTTP ${HTTP_STATUS:-no response})"
            exit 1
          fi

          echo "Knowledge graph built successfully (HTTP $HTTP_STATUS)"

  run-newsletter:
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger newsletter generation
        run: |
          RESPONSE=$(curl -sS -f \
            -X POST "${{ secrets.API_BASE_URL }}/internal/run-newsletter" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 1800 \
            -w "\nHTTP_STATUS:%{http_code}" \
            --retry 2 \
            --retry-delay 30 \
            --retry-connrefused \
            2>&1) || EXIT_CODE=$?

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)

          if [ -z "$HTTP_STATUS" ] || [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Newsletter generation failed (HTTP ${HTTP_STATUS:-no response})"
            exit 1
          fi

          echo "Newsletter generated successfully (HTTP $HTTP_STATUS)"

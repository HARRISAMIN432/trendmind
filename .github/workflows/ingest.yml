name: TrendMind Scheduled Jobs

on:
  schedule:
    # Ingestion pipeline — every 6 hours
    - cron: "0 */6 * * *"
    # Trend generation + knowledge graph build — twice daily
    - cron: "30 5,17 * * *"
    # Newsletter — once daily
    - cron: "0 6 * * *"
  workflow_dispatch: {} # lets you trigger any job manually from the Actions tab

jobs:
  run-pipeline:
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion pipeline
        run: |
          curl -sf -X POST "${{ secrets.API_BASE_URL }}/internal/run-pipeline" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            --max-time 120

  run-trends-and-graph:
    if: github.event.schedule == '30 5,17 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger trend generation
        run: |
          curl -sf -X POST "${{ secrets.API_BASE_URL }}/internal/run-trends" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            --max-time 120
      - name: Trigger knowledge graph build
        run: |
          curl -sf -X POST "${{ secrets.API_BASE_URL }}/internal/run-graph" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            --max-time 120

  run-newsletter:
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger newsletter generation
        run: |
          curl -sf -X POST "${{ secrets.API_BASE_URL }}/internal/run-newsletter" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            --max-time 120

name: DigestAI Scheduled Jobs

on:
  schedule:
    # Run every 2 days at 06:00 UTC
    - cron: "0 6 1-31/2 * *"

  workflow_dispatch: {} # allows manual triggering from Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger ingestion pipeline
        run: |
          echo "==> Calling API /internal/run-pipeline"
          echo "==> Started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          HTTP_STATUS=$(curl -sS \
            -X POST "${{ secrets.API_BASE_URL }}/internal/run-pipeline" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 1800 \
            --retry 2 \
            --retry-delay 30 \
            --retry-connrefused \
            -o /tmp/response.json \
            -w "%{http_code}")

          echo "==> Finished at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "==> HTTP status: $HTTP_STATUS"
          cat /tmp/response.json || true

          if [ -z "$HTTP_STATUS" ] || [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Pipeline failed (HTTP ${HTTP_STATUS:-no response})"
            exit 1
          fi

          echo "==> Pipeline completed successfully"

  run-trends-and-graph:
    needs: run-pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Trigger trend generation
        run: |
          echo "==> Calling API /internal/run-trends"

          HTTP_STATUS=$(curl -sS \
            -X POST "${{ secrets.API_BASE_URL }}/internal/run-trends" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 1800 \
            --retry 2 \
            --retry-delay 30 \
            --retry-connrefused \
            -o /tmp/response.json \
            -w "%{http_code}")

          echo "==> HTTP status: $HTTP_STATUS"
          cat /tmp/response.json || true

          if [ -z "$HTTP_STATUS" ] || [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Trend generation failed (HTTP ${HTTP_STATUS:-no response})"
            exit 1
          fi

          echo "==> Trends generated successfully"

      - name: Trigger knowledge graph build
        run: |
          echo "==> Calling API /internal/run-graph"

          HTTP_STATUS=$(curl -sS \
            -X POST "${{ secrets.API_BASE_URL }}/internal/run-graph" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 1800 \
            --retry 2 \
            --retry-delay 30 \
            --retry-connrefused \
            -o /tmp/response.json \
            -w "%{http_code}")

          echo "==> HTTP status: $HTTP_STATUS"
          cat /tmp/response.json || true

          if [ -z "$HTTP_STATUS" ] || [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Knowledge graph build failed (HTTP ${HTTP_STATUS:-no response})"
            exit 1
          fi

          echo "==> Knowledge graph built successfully"

  run-newsletter:
    needs: run-trends-and-graph
    runs-on: ubuntu-latest

    steps:
      - name: Trigger newsletter generation
        run: |
          echo "==> Calling API /internal/run-newsletter"

          HTTP_STATUS=$(curl -sS \
            -X POST "${{ secrets.API_BASE_URL }}/internal/run-newsletter" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 1800 \
            --retry 2 \
            --retry-delay 30 \
            --retry-connrefused \
            -o /tmp/response.json \
            -w "%{http_code}")

          echo "==> HTTP status: $HTTP_STATUS"
          cat /tmp/response.json || true

          if [ -z "$HTTP_STATUS" ] || [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Newsletter generation failed (HTTP ${HTTP_STATUS:-no response})"
            exit 1
          fi

          echo "==> Newsletter generated successfully"

name: TrendMind Scheduled Jobs

on:
  schedule:
    # Ingestion pipeline — every 6 hours
    - cron: "0 */6 * * *"
    # Trend generation + knowledge graph build — twice daily
    - cron: "30 5,17 * * *"
    # Newsletter — once daily
    - cron: "0 6 * * *"
  workflow_dispatch: {} # lets you trigger any job manually from the Actions tab

jobs:
  run-pipeline:
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion pipeline
        run: |
          curl -sS -f --retry 2 --retry-delay 30 --retry-connrefused \
            -X POST "${{ secrets.API_BASE_URL }}/internal/run-pipeline" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            --max-time 600 \
            -w "\nHTTP %{http_code}\n"

  run-trends-and-graph:
    runs-on: ubuntu-latest
    # needs run-pipeline so a manual workflow_dispatch run processes new
    # articles before generating trends/graph from them. On the real cron
    # schedules this is a no-op - the two cron expressions never fire in the
    # same event, so run-pipeline is always "skipped" (not run) on that path,
    # which the if: condition below explicitly allows through.
    needs: run-pipeline
    if: |
      always() &&
      (github.event.schedule == '30 5,17 * * *' || github.event_name == 'workflow_dispatch') &&
      (needs.run-pipeline.result == 'success' || needs.run-pipeline.result == 'skipped')
    steps:
      - name: Trigger trend generation
        run: |
          curl -sS -f --retry 2 --retry-delay 30 --retry-connrefused \
            -X POST "${{ secrets.API_BASE_URL }}/internal/run-trends" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            --max-time 300 \
            -w "\nHTTP %{http_code}\n"
      - name: Trigger knowledge graph build
        run: |
          curl -sS -f --retry 2 --retry-delay 30 --retry-connrefused \
            -X POST "${{ secrets.API_BASE_URL }}/internal/run-graph" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            --max-time 600 \
            -w "\nHTTP %{http_code}\n"

  run-newsletter:
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger newsletter generation
        run: |
          curl -sS -f --retry 2 --retry-delay 30 --retry-connrefused \
            -X POST "${{ secrets.API_BASE_URL }}/internal/run-newsletter" \
            -H "X-Scheduler-Key: ${{ secrets.SCHEDULER_API_KEY }}" \
            --max-time 180 \
            -w "\nHTTP %{http_code}\n"
